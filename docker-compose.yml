version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: outbox-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outbox_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - outbox-network

  # Test runner service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: outbox-test-runner
    environment:
      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: outbox_test
      CGO_ENABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    command: make test-integration-docker
    networks:
      - outbox-network

volumes:
  postgres_data:
    driver: local
  go-cache:
    driver: local
  go-build-cache:
    driver: local

networks:
  outbox-network:
    driver: bridge

